name: NPM INSTALL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Or your desired version, e.g., '18', '22'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci # Use 'npm ci' for clean and fast installs in CI environments
    - name: Run tests
      run: npm test
